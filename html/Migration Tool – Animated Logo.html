<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Migration Tool – Animated Logo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;800&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f7f8fb; --navy:#11204a; --muted:#7b8497;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0d1325; --navy:#eef2ff; --muted:#9aa5c0; }
}
:root[data-theme="dark"]{ --bg:#0d1325; --navy:#eef2ff; --muted:#9aa5c0; }
html,body{height:100%;margin:0}
body{background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:"Montserrat",system-ui,sans-serif}
.logo{width:min(600px,92vw);text-align:center}
svg{width:100%;height:auto;display:block;overflow:visible}
.name{margin:6px 0 0;font-weight:800;color:var(--navy);font-size:clamp(38px,10vw,66px);letter-spacing:.07em;line-height:1;white-space:nowrap}
.name span{display:inline-block;opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(.3s + var(--i)*.06s)}
.tool{margin:10px 0 0;font-weight:300;color:var(--muted);font-size:clamp(20px,5vw,34px);letter-spacing:.42em;padding-left:.42em;opacity:0;animation:rise .8s ease forwards;animation-delay:1.1s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.cloudL{animation:floatA 5s ease-in-out infinite}
.cloudR{animation:floatB 5s ease-in-out infinite}
@keyframes floatA{0%,100%{transform:translate(18px,35px) scale(.95)}50%{transform:translate(18px,30px) scale(.95)}}
@keyframes floatB{0%,100%{transform:translate(448px,32px) scale(-.92,.92)}50%{transform:translate(448px,37px) scale(-.92,.92)}}

.arrow{animation:nudge 1.6s ease-in-out infinite;transform-box:fill-box}
@keyframes nudge{0%,100%{transform:translateX(-3px);opacity:.85}50%{transform:translateX(7px);opacity:1}}

.glow{opacity:0;animation:glow 3.2s ease-in-out infinite;animation-delay:1.4s}
@keyframes glow{0%,55%,100%{opacity:0}75%{opacity:.3}}

.px{transform-box:fill-box;transform-origin:center;opacity:0;animation:fly var(--d) linear infinite;animation-delay:var(--l)}
@keyframes fly{
  0%{transform:translate(0,0) scale(.2);opacity:0;fill:#6a58e0}
  15%{opacity:1;transform:translate(calc(var(--dx)*.15),calc(var(--dy)*.15)) scale(1)}
  55%{fill:#3b82f6}
  85%{opacity:1;fill:#35cfc4}
  100%{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0;fill:#35cfc4}
}
@media (prefers-reduced-motion: reduce){
  .cloudL,.cloudR,.arrow,.glow,.px{animation:none}
  .cloudL{transform:translate(18px,35px) scale(.95)}
  .cloudR{transform:translate(448px,32px) scale(-.92,.92)}
  .px{opacity:.8}
  .name span,.tool{animation:none;opacity:1}
}
</style>
</head>
<body>
<div class="logo" role="img" aria-label="Migration Tool logo: a cloud sending data to another cloud">
<svg viewBox="0 0 476 150" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="gL" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a4fd6"/><stop offset="1" stop-color="#8056e4"/></linearGradient>
    <linearGradient id="gR" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b6fd8"/><stop offset="1" stop-color="#40d3c6"/></linearGradient>
    <linearGradient id="gA" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#2d63e0"/></linearGradient>
    <clipPath id="cc"><path id="cp" d="M25,100 C-5,100 -5,60 25,56 C22,20 62,8 82,28 C95,-2 145,6 150,48 C175,52 172,100 145,100 Z"/></clipPath>
    <g id="facets" clip-path="url(#cc)">
      <g fill="#fff" fill-opacity=".14"><polygon points="25,56 22,20 62,8 50,45"/><polygon points="82,28 95,-2 125,10 100,45"/><polygon points="25,100 50,45 80,100"/><polygon points="100,45 150,48 145,100 80,100"/></g>
      <g fill="#000" fill-opacity=".13"><polygon points="62,8 82,28 50,45"/><polygon points="125,10 150,48 100,45"/><polygon points="50,45 100,45 80,100"/><polygon points="150,48 175,52 172,100 145,100"/><polygon points="0,60 25,56 50,45 25,100 0,100"/></g>
    </g>
  </defs>

  <g class="cloudL"><use href="#cp" fill="url(#gL)"/><use href="#facets"/></g>
  <g class="cloudR"><use href="#cp" fill="url(#gR)"/><use href="#facets"/><use href="#cp" fill="#fff" class="glow"/></g>

  <path class="arrow" d="M190,78 H250 V64 L286,85 L250,106 V92 H190 Z" fill="url(#gA)"/>

  <g id="px"></g>
</svg>
<h1 class="name" id="name" style="font-size:inherit" aria-label="Migration"></h1>
<p class="tool">TOOL</p>
</div>
<script>
(function(){
  var n=document.getElementById('name');
  n.className='name';n.style.fontSize='';
  "MIGRATION".split('').forEach(function(c,i){var s=document.createElement('span');s.textContent=c;s.style.setProperty('--i',i);n.appendChild(s);});
  var g=document.getElementById('px'),NS='http://www.w3.org/2000/svg';
  for(var i=0;i<34;i++){
    var r=document.createElementNS(NS,'rect'),s=4+Math.random()*6;
    r.setAttribute('class','px');
    r.setAttribute('width',s);r.setAttribute('height',s);
    r.setAttribute('x',166+Math.random()*22);
    r.setAttribute('y',50+Math.random()*72);
    r.style.setProperty('--dx',(95+Math.random()*60)+'px');
    r.style.setProperty('--dy',((Math.random()-.5)*22)+'px');
    var d=2.4+Math.random()*1.4;
    r.style.setProperty('--d',d+'s');
    r.style.setProperty('--l',(-Math.random()*d)+'s');
    g.appendChild(r);
  }
})();
</script>
</body>
</html>
